name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  offline-checks:
    # 무비용·무네트워크 게이트: 컨텍스트 경로 무결성 + 오프라인 테스트 + 평가 pass-rate.
    # 무거운 색인 의존성(torch/FlagEmbedding)은 설치하지 않는다 — 이 검사들은 필요 없음.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight deps
        # numpy 는 relevance.py(코사인·centroid)가 직접 쓰므로 필요. openai 는 llm_ops 가
        # 지연 임포트하므로 불필요 — 이 게이트는 LLM 을 호출하지 않는다.
        run: pip install requests beautifulsoup4 python-dotenv numpy

      - name: Validate context paths (0 hallucinated paths)
        run: python .github/scripts/validate_context_paths.py

      - name: Validate context claims (0 stale claims)
        # 자매 게이트: 경로가 아니라 **상태 서술**을 검사한다. 2026-08-07 감사에서 CLAUDE.md 가
        # 이미 있는 `api/main.py` 를 '없다'고 단언한 게 잡혔는데, 경로 검사도 mtime drift 검사도
        # 그 유형은 못 잡는다(경로는 실재했고 문서·코드가 같은 날 수정됐다).
        run: python .github/scripts/validate_context_claims.py

      - name: Gold integrity (절대축 일치 + 3축 스키마)
        # 순수 JSON 검사라 numpy/torch 없이 돈다. 동일 텍스트의 M/Q/E 가 갈라지거나
        # AC3 쿼리조건부 하드 네거티브 6건이 삭제되면 실패한다.
        run: python evals/check_gold_integrity.py

      - name: Offline unit tests
        # test_relevance_gate 는 BGE-M3(torch) 가 필요해 이 경량 게이트에서 제외 — 로컬 전용.
        # 아래 둘은 키 없으면 실호출 케이스만 skip 하고 결정적 부분(프롬프트 스냅샷·
        # firsthand_evidence 게이트·배치 호출 수/귀속)은 그대로 검증한다.
        # test_source_links 는 원문 링크·임베드가 **어떤 조건에서** 나오는가(정책)를 덮는다.
        # 렌더 배선 테스트는 프런트엔드와 함께 사라졌다(ADR-0012). 새 프런트엔드가 오면
        # 그 테스트는 **별도 잡**으로 둔다 — 이 잡에 UI 런타임을 설치하기 시작하면
        # '앱을 설치해야 도는 테스트'로 미끄러진다.
        run: |
          python -m eval.test_bias
          python -m eval.test_apify_source
          python -m eval.test_extract_hearsay
          python -m eval.test_extract_thread
          python -m eval.test_source_links
          python -m eval.test_post_columns
          python -m eval.test_spec_overrides
          # 제품 귀속 두 벌 — 둘 다 순수 함수 게이트라 torch·DB·키가 필요 없다.
          # test_product_repair 는 원래 로컬에만 있었는데, 유령 제품과 **비제품 라벨**의
          # 과잉 차단 회귀를 함께 지키므로(양방향으로 조용히 부서지는 자리) CI 로 올린다.
          python -m eval.test_product_repair
          python -m eval.test_market_inversion
          # 마켓 귀속 세 벌 — 같은 이유로 순수 함수 게이트다(torch·DB·키 불필요).
          # test_market_prefix 는 접두 분리 규칙과 **추출→개체연결 합성 순서**를 지킨다.
          #   그 순서가 틀리면 맨몸 마켓 표기가 스레드 도장 마켓을 0.95 로 물려받는데,
          #   두 함수를 따로 보는 테스트는 **전부 통과한 채로** 그렇게 된다(실측 회귀).
          # test_market_backfill 은 채움 경로별 `market_confidence` 값이 안 겹치는지 본다 —
          #   그 숫자가 provenance 이자 롤백의 유일한 열쇠라 겹치면 층별로 못 되돌린다.
          python -m eval.test_market_prefix
          python -m eval.test_market_backfill
          python -m eval.test_alias_candidates

      - name: Eval pass-rate gate
        run: python -m evals.run --min 1.0
